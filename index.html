<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Y&Y systems access portal.">
  <title>Y&amp;Y</title>
  <style>
    :root{color-scheme:dark;--red:#ff2a2a;--dim:#7d2020;--black:#030000}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--black);color:var(--red)}
    body{min-height:100vh;display:grid;place-items:center;font-family:"Courier New",Courier,monospace;overflow:hidden}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background:repeating-linear-gradient(to bottom,transparent 0,transparent 3px,rgba(255,42,42,.16) 4px)}
    body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at center,transparent 35%,rgba(70,0,0,.18) 100%)}
    main{position:relative;z-index:1;width:min(260px,calc(100vw - 44px));display:grid;gap:14px;text-align:center}
    .brand{border:1px solid var(--red);padding:16px 20px;font-size:1rem;font-weight:700;letter-spacing:.42em;text-indent:.42em;box-shadow:0 0 16px rgba(255,42,42,.11);text-shadow:0 0 9px rgba(255,42,42,.5)}
    form{display:grid;gap:10px}
    input,select,button{width:100%;min-height:46px;border:1px solid var(--red);border-radius:0;background:var(--black);color:var(--red);font:700 .78rem/1 "Courier New",Courier,monospace;letter-spacing:.18em;text-align:center;outline:none}
    input{caret-color:var(--red)}
    input:focus,select:focus,button:focus{box-shadow:0 0 12px rgba(255,42,42,.28)}
    input::placeholder{color:var(--dim)}
    button{cursor:pointer}
    button:hover{background:var(--red);color:var(--black)}
    .systems{display:none;gap:10px}
    .systems.open{display:grid;animation:reveal .22s steps(3,end)}
    select{appearance:none;padding:0 36px 0 14px;text-align-last:center;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--red) 50%),linear-gradient(135deg,var(--red) 50%,transparent 50%);background-position:calc(100% - 17px) 19px,calc(100% - 12px) 19px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
    .error{min-height:12px;margin:0;color:var(--dim);font-size:.62rem;letter-spacing:.12em}
    @keyframes reveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
    @media(prefers-reduced-motion:reduce){.systems.open{animation:none}}
  </style>
</head>
<body>
  <main>
    <div class="brand" aria-label="Y and Y">Y&amp;Y</div>
    <form id="gate" autocomplete="off">
      <input id="code" type="password" inputmode="numeric" maxlength="3" pattern="[0-9]{3}" aria-label="Access code" placeholder="___" autofocus>
      <p class="error" id="status" aria-live="polite"></p>
    </form>
    <div class="systems" id="systems">
      <select id="tool" aria-label="Select Y and Y tool">
        <option value="">SELECT SYSTEM</option>
        <option value="/worldwatch/">WORLD WATCH</option>
        <option value="/threshold/">THRESHOLD</option>
        <option value="/atlas/">ATLAS</option>
        <option value="/intake/">INTAKE</option>
        <option value="/infrawatch/">INFRAWATCH</option>
        <option value="/academy/">ACADEMY</option>
        <option value="/brief/">BRIEF</option>
      </select>
      <button id="enter" type="button">ENTER</button>
    </div>
  </main>
  <script>
    const gate=document.getElementById("gate"),code=document.getElementById("code"),systems=document.getElementById("systems"),status=document.getElementById("status"),tool=document.getElementById("tool");
    function unlock(){
      if(code.value==="369"){
        gate.hidden=true;systems.classList.add("open");status.textContent="";tool.focus();sessionStorage.setItem("yy-access","1");
      }else{
        code.value="";status.textContent="ACCESS DENIED";code.focus();
      }
    }
    gate.addEventListener("submit",e=>{e.preventDefault();unlock()});
    code.addEventListener("input",()=>{status.textContent="";if(code.value.length===3)unlock()});
    function launch(){if(tool.value)location.href=tool.value}
    document.getElementById("enter").addEventListener("click",launch);
    tool.addEventListener("change",launch);
    if(sessionStorage.getItem("yy-access")==="1"){gate.hidden=true;systems.classList.add("open")}
  </script>
</body>
</html>
