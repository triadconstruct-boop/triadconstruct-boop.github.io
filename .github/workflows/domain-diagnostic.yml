name: Y&Y Domain Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/domain-diagnostic.yml'

permissions:
  contents: read
  pages: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Pages and DNS state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pages" > /tmp/pages.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/pages.json'))
          print(json.dumps({
              'status': p.get('status'),
              'cname': p.get('cname'),
              'html_url': p.get('html_url'),
              'https_enforced': p.get('https_enforced'),
              'protected_domain_state': p.get('protected_domain_state'),
              'pending_domain_unverified_at': p.get('pending_domain_unverified_at'),
              'https_certificate': p.get('https_certificate'),
          }, indent=2))
          PY
          echo 'A records:'
          dig +short A yyrv.net
          echo 'AAAA records:'
          dig +short AAAA yyrv.net
          echo 'CAA records:'
          dig +short CAA yyrv.net
          echo 'NS records:'
          dig +short NS yyrv.net
          echo 'SOA record:'
          dig +short SOA yyrv.net
          echo 'GitHub verification TXT:'
          dig +short TXT _github-pages-challenge-triadconstruct-boop.yyrv.net
          echo 'Presented certificate:'
          timeout 20 openssl s_client -connect yyrv.net:443 -servername yyrv.net </dev/null 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName
