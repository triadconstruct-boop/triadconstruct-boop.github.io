name: Y&Y Intelligence Engine

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'tests/**'
      - 'assets/**'
      - '**/index.html'
      - 'docs/**'
      - '.github/workflows/y-and-y-autonomous.yml'

permissions:
  contents: write

concurrency:
  group: y-and-y-intelligence-engine
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate code and interface syntax
        run: |
          python3 -m py_compile scripts/y_and_y_autonomous.py scripts/y_and_y_signal_refiner.py scripts/yy_engine/*.py
          node --check assets/y-and-y-live.js
          node --check assets/edges.js

      - name: Run historical and regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Collect and analyze public sources
        run: python3 scripts/y_and_y_autonomous.py

      - name: Validate generated intelligence products
        run: |
          python3 scripts/validate_generated.py
          python3 scripts/validate_site.py
          git diff --check

      - name: Write run summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s=json.load(open('data/autonomy-status.json'))
          t=json.load(open('data/threshold-live.json'))
          w=json.load(open('data/wwt-live.json'))
          print('## Y&Y Intelligence Engine v3')
          print(f"- Situation: **{s['situation']}**")
          print(f"- Source coverage: **{s['source_health_percent']}%** ({s['sources_ok']}/{s['sources_total']})")
          print(f"- New observations: **{s['new_observations']}**")
          print(f"- Preserved claims: **{s['claim_count']}**")
          print(f"- States: `{s['claim_status_counts']}`")
          print(f"- THRESHOLD confirmed / precursor: **{t['confirmed_homeland_signal']['score']} / {t['precursor_speculative_signal']['score']}**")
          print(f"- WWT verified / early warning: **{w['verified_pressure']['score']} / {w['early_warning_pressure']['score']}**")
          print(f"- Poll: `{s['last_poll']}`")
          PY

      - name: Commit and publish generated data
        run: |
          set -euo pipefail
          git config user.name "Y&Y Intelligence Engine"
          git config user.email "actions@users.noreply.github.com"

          stage_and_commit() {
            git add data/
            if git diff --cached --quiet; then
              echo "No generated data changes."
              return 1
            fi
            git commit -m "Y&Y: layered intelligence refresh"
          }

          regenerate() {
            python3 scripts/y_and_y_autonomous.py
            python3 scripts/validate_generated.py
            python3 scripts/validate_site.py
            git diff --check
          }

          if ! stage_and_commit; then exit 0; fi
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Y&Y publish succeeded on attempt $attempt."
              exit 0
            fi
            echo "Remote changed; regenerating against current main."
            git fetch origin main
            git reset --hard origin/main
            regenerate
            if ! stage_and_commit; then exit 0; fi
          done
          echo "Y&Y publish failed after three race-safe attempts." >&2
          exit 1
